<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Agrogestión</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #1c2b1f; --muted: #5b6b5e; --accent: #2f6b3a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111712; --fg: #e8efe9; --muted: #a3b2a6; --accent: #7cc48a; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      main { box-sizing: border-box; min-height: 100%; display: grid; place-content: center; gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; }
      h1 { margin: 0; font-size: 1.25rem; }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      a { justify-self: center; margin-top: 8px; padding: 12px 20px; border-radius: 12px; background: var(--accent);
        color: var(--bg); font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>No pudimos abrir Agrogestión</h1>
      <p>Revisá tu conexión a internet y probá de nuevo.</p>
      <a href="https://agrogestion.app/ingresar">Reintentar</a>
    </main>
  </body>
</html>
